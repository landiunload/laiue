# Secure dedicated server configuration.
# The server listens on UDP and fails closed until platform credentials below
# are configured. `dual` accepts IPv4 and IPv6 on the same wildcard listener.
port = 27180
address_family = dual
listen_address = *
maximum_peers = 16
world_seed = 42
allow_content_downloads = false

# Linux (PEM, the private key must be a regular non-symlink file mode 0600):
# certificate_file = certificates/server-cert.pem
# private_key_file = certificates/server-key.pem

# Windows (SHA-1 thumbprint from the Windows certificate store):
# certificate_thumbprint = 0123456789abcdef0123456789abcdef01234567
