name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-engine:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-msvc, windows-clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Activate x64 compiler environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (!$vsRoot) { throw 'Visual Studio x64 C tools were not found' }
          $vsRoot = @($vsRoot)[0].Trim()
          Import-Module (Join-Path $vsRoot `
            'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsRoot `
            -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($name in 'INCLUDE', 'LIB', 'LIBPATH', 'PATH') {
            "$name=$([Environment]::GetEnvironmentVariable($name))" |
              Out-File $env:GITHUB_ENV -Append
          }
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DLAIUE_BUILD_EXAMPLES=ON
      - name: Build Debug
        run: cmake --build --preset ${{ matrix.preset }}-debug --parallel
      - name: Test Debug
        run: ctest --preset ${{ matrix.preset }}-debug --no-tests=error
      - name: Verify checked-in shaders
        run: >
          cmake --build --preset ${{ matrix.preset }}-debug
          --target laiue_verify_shaders
      - name: Build Release
        run: cmake --build --preset ${{ matrix.preset }}-release --parallel
      - name: Test Release
        run: ctest --preset ${{ matrix.preset }}-release --no-tests=error
      - name: Verify native walk scenario and GPU captures
        id: walk-scenario
        shell: pwsh
        timeout-minutes: 8
        run: |
          foreach ($configuration in 'Debug', 'Release') {
            ./tools/test_windows_walk.ps1 `
              -GameExe "build/${{ matrix.preset }}/bin/$configuration/laiue_walk.exe" `
              -FrameCheckExe "build/${{ matrix.preset }}/bin/$configuration/laiue_frame_check.exe" `
              -OutputDir "build/${{ matrix.preset }}/walk-scenario/$configuration" `
              -TimeoutSeconds 180
          }
      - name: Upload native walk captures and measurements
        if: always() && steps.walk-scenario.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: laiue-walk-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/walk-scenario/**/*.png
            build/${{ matrix.preset }}/walk-scenario/**/*.json
            build/${{ matrix.preset }}/walk-scenario/**/*.log
          if-no-files-found: error
      - name: Stage engine SDK
        if: matrix.preset == 'windows-msvc'
        run: >
          cmake --build --preset windows-msvc-release
          --target laiue_engine_bundle
      - name: Upload Windows engine SDK
        if: matrix.preset == 'windows-msvc'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: laiue-engine-windows-x86_64
          path: build/windows-msvc/bundles/engine/Release
          if-no-files-found: error
      - name: Verify build did not modify sources
        run: >
          cmake "-DSOURCE_ROOT=$env:GITHUB_WORKSPACE"
          -P tools/verify_source_tree.cmake

  windows-arm64-engine:
    name: Windows ARM64 engine (${{ matrix.preset }})
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-msvc-arm64, windows-clang-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Activate ARM64 compiler environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            -property installationPath
          if (!$vsRoot) { throw 'Visual Studio ARM64 C tools were not found' }
          $vsRoot = @($vsRoot)[0].Trim()
          Import-Module (Join-Path $vsRoot `
            'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsRoot `
            -SkipAutomaticLocation -DevCmdArguments '-arch=arm64 -host_arch=arm64'
          foreach ($name in 'INCLUDE', 'LIB', 'LIBPATH', 'PATH') {
            "$name=$([Environment]::GetEnvironmentVariable($name))" |
              Out-File $env:GITHUB_ENV -Append
          }
      - name: Confirm the runner is native ARM64
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') {
            throw "Expected an ARM64 runner, got $env:PROCESSOR_ARCHITECTURE"
          }
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DLAIUE_BUILD_EXAMPLES=ON
      - name: Build Debug
        run: cmake --build --preset ${{ matrix.preset }}-debug --parallel
      - name: Test Debug
        run: ctest --preset ${{ matrix.preset }}-debug --no-tests=error
      - name: Build Release
        run: cmake --build --preset ${{ matrix.preset }}-release --parallel
      - name: Test Release
        run: ctest --preset ${{ matrix.preset }}-release --no-tests=error
      - name: Stage engine SDK
        if: matrix.preset == 'windows-msvc-arm64'
        run: >
          cmake --build --preset windows-msvc-arm64-release
          --target laiue_engine_bundle
      - name: Upload Windows ARM64 engine SDK
        if: matrix.preset == 'windows-msvc-arm64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: laiue-engine-windows-arm64
          path: build/windows-msvc-arm64/bundles/engine/Release
          if-no-files-found: error
      - name: Verify build did not modify sources
        run: >
          cmake "-DSOURCE_ROOT=$env:GITHUB_WORKSPACE"
          -P tools/verify_source_tree.cmake

  linux-engine:
    runs-on: ubuntu-24.04
    container: debian:13-slim
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-gcc, linux-clang, linux-gcc-asan]
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates clang cmake gcc git \
            ninja-build
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DLAIUE_BUILD_GRAPHICS=OFF -DLAIUE_BUILD_EXAMPLES=ON
          -DLAIUE_BUILD_BENCHMARKS=${{ matrix.preset == 'linux-gcc' && 'ON' || 'OFF' }}
      - name: Build Debug
        run: cmake --build --preset ${{ matrix.preset }}-debug --parallel
      - name: Compile mesh-world and audio-stream manual benchmarks (Debug)
        if: matrix.preset == 'linux-gcc'
        run: >
          cmake --build --preset linux-gcc-debug --parallel
          --target laiue_mesh_world_query_benchmark laiue_audio_stream_benchmark
      - name: Test Debug
        run: ctest --preset ${{ matrix.preset }}-debug --no-tests=error
      - name: Build Release
        if: matrix.preset != 'linux-gcc-asan'
        run: cmake --build --preset ${{ matrix.preset }}-release --parallel
      - name: Compile mesh-world and audio-stream manual benchmarks (Release)
        if: matrix.preset == 'linux-gcc'
        run: >
          cmake --build --preset linux-gcc-release --parallel
          --target laiue_mesh_world_query_benchmark laiue_audio_stream_benchmark
      - name: Test Release
        if: matrix.preset != 'linux-gcc-asan'
        run: ctest --preset ${{ matrix.preset }}-release --no-tests=error
      - name: Compile-test external static core seam
        if: matrix.preset == 'linux-gcc'
        run: |
          cmake --preset linux-external-port-smoke
          cmake --build --preset linux-external-port-smoke-release --parallel
          ctest --preset linux-external-port-smoke-release --no-tests=error
      - name: Stage engine SDK
        if: matrix.preset == 'linux-clang'
        run: >
          cmake --build --preset linux-clang-release
          --target laiue_engine_bundle
      - name: Upload Linux engine SDK
        if: matrix.preset == 'linux-clang'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: laiue-engine-linux-gnu-x86_64
          path: build/linux-clang/bundles/engine/Release
          if-no-files-found: error
      - name: Verify build did not modify sources
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" \
            -P tools/verify_source_tree.cmake

  linux-fuzz-corpus:
    name: Linux parser fuzz corpus (Clang)
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates clang cmake git \
            libclang-rt-dev ninja-build
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure
        run: cmake --preset linux-clang-fuzz
      # Движок собран с ASan/UBSan и покрытием libFuzzer; каждый фаззер
      # повторяет семена и входы, однажды ронявшие разборщик.
      - name: Build fuzzers
        run: >
          cmake --build --preset linux-clang-fuzz-debug --parallel
          --target laiue_fuzzers
      - name: Replay seed and regression corpus
        run: ctest --preset linux-clang-fuzz-debug -R '^laiue[.]fuzz[.]' --no-tests=error
      - name: Verify build did not modify sources
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" \
            -P tools/verify_source_tree.cmake

  linux-vulkan-engine:
    name: Linux Vulkan offscreen renderer
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates cmake gcc git ninja-build \
            glslang-tools libvulkan-dev mesa-vulkan-drivers spirv-tools \
            vulkan-validationlayers libx11-dev xvfb xauth
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # С заголовками X11 профиль собирает и X11-окно с вводом: без них
      # эти модули выпадали из сборки, и их поломка оставалась незамеченной.
      - name: Configure
        run: >
          cmake --preset linux-vulkan-offscreen
          -DLAIUE_REQUIRE_VULKAN_TEST_DRIVER=ON -DLAIUE_BUILD_EXAMPLES=ON
      - name: Build Debug
        run: cmake --build --preset linux-vulkan-offscreen-debug --parallel
      # Кадр рисуется программным драйвером Mesa: GPU у раннера нет, но
      # рендер проверяется по пикселям, а не только по кодам возврата.
      # Слои Khronos превращают неверное использование Vulkan в ошибку —
      # без них драйвер молча прощает часть нарушений спецификации.
      - name: Test Debug on lavapipe
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          VK_LOADER_LAYERS_ENABLE: VK_LAYER_KHRONOS_validation
        run: ctest --preset linux-vulkan-offscreen-debug --no-tests=error
      # --frames требует настоящее окно, успешные Device V2 submissions и
      # непустую геометрию. Отсутствие X11 не превращает smoke в успешный skip.
      - name: Smoke mesh-world X11 presentation on lavapipe (Debug)
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          VK_LOADER_LAYERS_ENABLE: VK_LAYER_KHRONOS_validation
        run: >
          timeout 60s xvfb-run -a -s '-screen 0 960x540x24'
          build/linux-vulkan-offscreen/bin/Debug/laiue_mesh_world_demo --frames 12
      - name: Build Release
        run: cmake --build --preset linux-vulkan-offscreen-release --parallel
      - name: Test Release on lavapipe
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          VK_LOADER_LAYERS_ENABLE: VK_LAYER_KHRONOS_validation
        run: ctest --preset linux-vulkan-offscreen-release --no-tests=error
      - name: Smoke mesh-world X11 presentation on lavapipe (Release)
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          VK_LOADER_LAYERS_ENABLE: VK_LAYER_KHRONOS_validation
        run: >
          timeout 60s xvfb-run -a -s '-screen 0 960x540x24'
          build/linux-vulkan-offscreen/bin/Release/laiue_mesh_world_demo --frames 12
      # Checked-in SPIR-V обязан совпадать с тем, что glslang выдаёт из
      # HLSL: иначе сборка без компилятора шейдеров получила бы другой
      # рендер, чем сборка с ним.
      - name: Verify checked-in SPIR-V matches the HLSL sources
        run: >
          cmake --build build/linux-vulkan-offscreen
          --target laiue_verify_shaders
      - name: Verify build did not modify sources
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" \
            -P tools/verify_source_tree.cmake

  linux-arm64-engine:
    name: Linux ARM64 core (GCC)
    runs-on: ubuntu-24.04-arm
    container: debian:13-slim
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates cmake gcc git ninja-build
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure headless core
        run: |
          test "$(uname -m)" = aarch64
          cmake --preset linux-gcc-arm64 -DLAIUE_BUILD_EXAMPLES=ON
      - name: Build and test Debug
        run: |
          cmake --build --preset linux-gcc-arm64-debug --parallel
          ctest --preset linux-gcc-arm64-debug --no-tests=error
      - name: Build and test Release
        run: |
          cmake --build --preset linux-gcc-arm64-release --parallel
          ctest --preset linux-gcc-arm64-release --no-tests=error
      - name: Stage engine SDK
        run: >
          cmake --build --preset linux-gcc-arm64-release
          --target laiue_engine_bundle --parallel
      - name: Upload Linux ARM64 engine SDK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: laiue-engine-linux-gnu-arm64
          path: build/linux-gcc-arm64/bundles/engine/Release
          if-no-files-found: error
      - name: Verify build did not modify sources
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" \
            -P tools/verify_source_tree.cmake

  musl-engine:
    runs-on: ubuntu-24.04
    container: alpine:3.24
    steps:
      - name: Install build dependencies
        run: >
          apk add --no-cache build-base cmake git ninja
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure
        run: >
          cmake --preset linux-musl
          -DLAIUE_BUILD_GRAPHICS=OFF -DLAIUE_BUILD_EXAMPLES=ON
      - name: Build and test Debug
        run: |
          cmake --build --preset linux-musl-debug --parallel
          ctest --preset linux-musl-debug --no-tests=error
      - name: Build and test Release
        run: |
          cmake --build --preset linux-musl-release --parallel
          ctest --preset linux-musl-release --no-tests=error
      - name: Verify build did not modify sources
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" \
            -P tools/verify_source_tree.cmake

  android-arm64-engine:
    name: Android ARM64 core/link (NDK r29)
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify pinned Android NDK
        run: test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
      - name: Verify complete Android static-link closure
        run: |
          cmake --preset android-arm64-core-closure
          cmake --build --preset android-arm64-core-closure --parallel
      - name: Configure Android core
        run: cmake --preset android-arm64-core
      - name: Compile and link Android targets
        run: cmake --build --preset android-arm64-core-release --parallel
      # Пример NativeActivity делит с desktop-walk код ragdoll и выбор
      # модулей; без этой сборки его поломка оставалась бы незамеченной.
      - name: Compile and link Android walk example
        run: |
          cmake --preset android-arm64-walk
          cmake --build --preset android-arm64-walk-release --parallel
      - name: Verify build did not modify sources
        run: |
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" \
            -P tools/verify_source_tree.cmake

  android-emulator-runtime:
    name: Android API 35 native Vulkan runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build the shared image checker for the host
        timeout-minutes: 6
        run: |
          cmake --preset linux-gcc -B build/android-emulator-host \
            -DLAIUE_BUILD_GRAPHICS=OFF -DLAIUE_BUILD_EXAMPLES=OFF \
            -DLAIUE_BUILD_TOOLS=ON -DBUILD_TESTING=OFF \
            -DLAIUE_ENABLE_SDK_INSTALL=OFF
          cmake --build build/android-emulator-host --config Release \
            --target laiue_frame_check --parallel
      - name: Prepare pinned Android tools and the test image
        id: prepare-runtime
        timeout-minutes: 12
        run: |
          mkdir -p build/android-runtime-results "$RUNNER_TEMP/laiue-sdk-tools" \
            "$RUNNER_TEMP/laiue-pinned-emulator" "$RUNNER_TEMP/laiue-avd"
          printf 'ANDROID_AVD_HOME=%s/laiue-avd\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          curl --fail --location --connect-timeout 20 --max-time 180 --retry 2 \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            --output "$RUNNER_TEMP/laiue-sdk-tools.zip"
          printf '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  %s\n' \
            "$RUNNER_TEMP/laiue-sdk-tools.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/laiue-sdk-tools.zip" -d "$RUNNER_TEMP/laiue-sdk-tools"
          tools="$RUNNER_TEMP/laiue-sdk-tools/cmdline-tools/bin"
          test "$("$tools/sdkmanager" --version)" = '22.0'
          for ((answer=0; answer<32; ++answer)); do printf 'y\n'; done \
            > "$RUNNER_TEMP/laiue-sdk-answers.txt"
          "$tools/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses \
            < "$RUNNER_TEMP/laiue-sdk-answers.txt"
          "$tools/sdkmanager" --sdk_root="$ANDROID_HOME" --install \
            'platforms;android-35' 'build-tools;35.0.0' \
            'system-images;android-35;google_apis;x86_64' \
            < "$RUNNER_TEMP/laiue-sdk-answers.txt"
          curl --fail --location --connect-timeout 20 --max-time 180 --retry 2 \
            https://dl.google.com/android/repository/emulator-linux_x64-15917651.zip \
            --output "$RUNNER_TEMP/laiue-emulator.zip"
          printf '95771e0ae431897b2a4bd2d97fa095f29a8b0624a7b216baf529f9306161c266  %s\n' \
            "$RUNNER_TEMP/laiue-emulator.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/laiue-emulator.zip" -d "$RUNNER_TEMP/laiue-pinned-emulator"
          emulator="$RUNNER_TEMP/laiue-pinned-emulator/emulator"
          grep -Fx 'Pkg.Revision=37.1.11' "$emulator/source.properties"
          grep -Fx 'Pkg.BuildId=15917651' "$emulator/source.properties"
          "$emulator/emulator" -version > build/android-runtime-results/tool-versions.txt
          printf '\nNDK: 29.0.14206865; command-line tools: 22.0; build-tools: 35.0.0\n' \
            >> build/android-runtime-results/tool-versions.txt
          cat "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/source.properties" \
            >> build/android-runtime-results/tool-versions.txt
          keytool -genkeypair -keystore "$RUNNER_TEMP/laiue-ci-debug.p12" \
            -storetype PKCS12 -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 \
            -dname 'CN=Android Debug,O=Android,C=US'
      - name: Build and sign the native test APK
        timeout-minutes: 8
        run: |
          tools="$ANDROID_HOME/build-tools/35.0.0"
          cmake --preset android-x86_64-walk-api35 \
            -DLAIUE_ANDROID_AAPT2="$tools/aapt2" \
            -DLAIUE_ANDROID_ZIPALIGN="$tools/zipalign" \
            -DLAIUE_ANDROID_APKSIGNER="$tools/apksigner" \
            -DLAIUE_ANDROID_FRAMEWORK_JAR="$ANDROID_HOME/platforms/android-35/android.jar" \
            -DLAIUE_ANDROID_KEYSTORE="$RUNNER_TEMP/laiue-ci-debug.p12"
          cmake --build build/android-x86_64-walk-api35 --config Release \
            --target laiue_walk_android_apk --parallel
      - name: Boot the emulator with software Vulkan
        id: emulator
        timeout-minutes: 4
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          emulator="$RUNNER_TEMP/laiue-pinned-emulator/emulator/emulator"
          timeout 15s "$emulator" -accel-check
          printf 'no\n' | "$RUNNER_TEMP/laiue-sdk-tools/cmdline-tools/bin/avdmanager" \
            create avd --force --name laiue-ci-api35 --device nexus_6 \
            --package 'system-images;android-35;google_apis;x86_64'
          cat >> "$ANDROID_AVD_HOME/laiue-ci-api35.avd/config.ini" <<'CONFIG'
          hw.lcd.width=1080
          hw.lcd.height=1920
          hw.lcd.density=420
          CONFIG
          setsid timeout --signal=TERM --kill-after=10s 600s "$emulator" \
            -avd laiue-ci-api35 -no-snapshot -no-boot-anim -no-audio -no-window \
            -gpu swiftshader -accel on -port 5554 -cores 2 -memory 2048 \
            > build/android-runtime-results/emulator.log 2>&1 &
          printf '%s\n' "$!" > "$RUNNER_TEMP/laiue-emulator.pid"
          adb="$ANDROID_HOME/platform-tools/adb"
          timeout 180s "$adb" -s emulator-5554 wait-for-device
          boot_deadline=$((SECONDS + 150))
          until [ "$(timeout 10s "$adb" -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; do
            if [ "$SECONDS" -ge "$boot_deadline" ]; then
              cat build/android-runtime-results/emulator.log
              exit 1
            fi
            sleep 2
          done
          timeout 10s "$adb" -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
          timeout 10s "$adb" -s emulator-5554 shell wm dismiss-keyguard
      - name: Verify native Android gameplay, rotation and resume
        timeout-minutes: 5
        shell: pwsh
        run: |
          ./tools/test_android_walk.ps1 `
            -AdbPath "$env:ANDROID_HOME/platform-tools/adb" `
            -Serial emulator-5554 `
            -Apk build/android-x86_64-walk-api35/android/Release/laiue-walk.apk `
            -FrameCheckExe build/android-emulator-host/bin/Release/laiue_frame_check `
            -OutputDir build/android-runtime-results/captures `
            -TimeoutSeconds 240
      - name: Stop the owned emulator process group
        if: always()
        timeout-minutes: 1
        run: |
          pid_file="$RUNNER_TEMP/laiue-emulator.pid"
          if [ -f "$pid_file" ]; then
            emulator_pid="$(cat "$pid_file")"
            if [[ ! "$emulator_pid" =~ ^[0-9]+$ ]]; then exit 1; fi
            if kill -0 -- "-$emulator_pid" 2>/dev/null; then
              kill -TERM -- "-$emulator_pid"
            fi
          fi
      - name: Upload Android runtime captures and diagnostics
        if: always() && steps.prepare-runtime.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: laiue-walk-android-api35
          path: build/android-runtime-results
          if-no-files-found: error
      - name: Verify runtime checks did not modify sources
        run: |
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" \
            -P tools/verify_source_tree.cmake

  macos-engine:
    name: macOS core (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            architecture: arm64
            preset: macos-clang-arm64
          - runner: macos-26-intel
            architecture: x86_64
            preset: macos-clang-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install build dependencies
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi
      - name: Configure headless core
        run: |
          cmake --preset "${{ matrix.preset }}" \
            -DLAIUE_BUILD_GRAPHICS=OFF -DLAIUE_BUILD_EXAMPLES=ON
      - name: Build and test Debug
        run: |
          cmake --build --preset "${{ matrix.preset }}-debug" --parallel
          ctest --preset "${{ matrix.preset }}-debug" --no-tests=error
      - name: Build and test Release
        run: |
          cmake --build --preset "${{ matrix.preset }}-release" --parallel
          ctest --preset "${{ matrix.preset }}-release" --no-tests=error
      - name: Stage core SDK
        run: >
          cmake --build --preset "${{ matrix.preset }}-release"
          --target laiue_engine_bundle
      - name: Compile iOS ARM64 static core
        if: matrix.architecture == 'arm64'
        run: |
          xcodebuild -version
          cmake --preset ios-arm64-core
          cmake --build --preset ios-arm64-core-debug --parallel
          cmake --build --preset ios-arm64-core-release --parallel
      - name: Verify complete iOS static-link closure without LTO
        if: matrix.architecture == 'arm64'
        run: |
          cmake --preset ios-arm64-core -B build/ios-arm64-core-closure \
            -DLAIUE_ENABLE_LTO=OFF
          cmake --build build/ios-arm64-core-closure --config Debug --parallel \
            --target laiue_static_core_link_smoke
      - name: Upload macOS core SDK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: laiue-engine-macos-${{ matrix.architecture }}
          path: build/${{ matrix.preset }}/bundles/engine/Release
          if-no-files-found: error
      - name: Verify build did not modify sources
        run: |
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" \
            -P tools/verify_source_tree.cmake
