name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-msvc-arm64-forms:
    runs-on: windows-11-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare initialization forms
        shell: pwsh
        working-directory: probe/forms
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            -property installationPath
          $vsRoot = @($vsRoot)[0].Trim()
          Import-Module (Join-Path $vsRoot `
            'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsRoot `
            -SkipAutomaticLocation -DevCmdArguments '-arch=arm64 -host_arch=arm64'
          "image $env:ImageVersion, MSVC $env:VCToolsVersion"
          $engine = '/O2 /Ot /Oi /GF /Gy /Gw /volatile:iso /Zc:inline /arch:armv8.2 /GS- /Ob3'
          foreach ($flags in '/O2', "$engine", "$engine /GL") {
            $list = $flags -split ' '
            cl /nologo /c /W4 @list forms.c | Out-Null
            cl /nologo /c /W4 /O2 main.c | Out-Null
            $ltcg = if ($list -contains '/GL') { '/LTCG' } else { '/INCREMENTAL:NO' }
            link /nologo $ltcg forms.obj main.obj /OUT:forms.exe | Out-Null
            "--- $flags"
            ./forms.exe
          }