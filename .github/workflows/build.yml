name: build

on:
  push:
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configure_preset:
          [windows-msvc, windows-clang, windows-msvc-server]
    steps:
      - uses: actions/checkout@v5
      - name: Activate x64 MSVC environment
        if: matrix.configure_preset == 'windows-clang'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = & $vswhere -products * -version '[17.0,18.0)' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (!$vsRoot) {
            throw 'Visual Studio 2022 C++ tools were not found'
          }
          $env:PATH = "$(Split-Path $vswhere);$env:PATH"
          $devShell = Join-Path $vsRoot `
            'Common7\Tools\Microsoft.VisualStudio.DevShell.dll'
          Import-Module $devShell
          Enter-VsDevShell -VsInstallPath $vsRoot `
            -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($name in 'INCLUDE', 'LIB', 'LIBPATH', 'PATH') {
            $value = [Environment]::GetEnvironmentVariable($name)
            "$name=$value" | Out-File $env:GITHUB_ENV -Append
          }
      - name: Install MsQuic 2.5.9
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'msquic.zip'
          $root = Join-Path $env:RUNNER_TEMP 'msquic'
          Invoke-WebRequest `
            -Uri 'https://www.nuget.org/api/v2/package/Microsoft.Native.Quic.MsQuic.Schannel/2.5.9' `
            -OutFile $archive
          $expected = '9877A919E1AA73AA4800F1E8A06B6539021F376228910138EB04540CD956617B'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) {
            throw 'MsQuic NuGet SHA-256 mismatch'
          }
          Expand-Archive -Path $archive -DestinationPath $root -Force
          $notice = Join-Path $root 'THIRD-PARTY-NOTICES'
          Invoke-WebRequest `
            -Uri 'https://raw.githubusercontent.com/microsoft/msquic/87b53085d76bd7920d490a6f226c9999b6614d14/THIRD-PARTY-NOTICES' `
            -OutFile $notice
          $noticeHash = 'C823706397513B6EAB16AF7BD5CA30F8E98272712C71688AC246D7AEC00FA5BB'
          if ((Get-FileHash $notice -Algorithm SHA256).Hash -ne $noticeHash) {
            throw 'MsQuic third-party notices SHA-256 mismatch'
          }
          "LAIUE_MSQUIC_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Configure
        shell: pwsh
        run: >
          cmake --preset ${{ matrix.configure_preset }}
          "-DLAIUE_MSQUIC_ROOT=$env:LAIUE_MSQUIC_ROOT"
          -DLAIUE_REQUIRE_MSQUIC=ON
      - name: Build Debug
        run: >
          cmake --build
          --preset ${{ matrix.configure_preset }}-debug --parallel
      - name: Test Debug
        run: >
          ctest --preset ${{ matrix.configure_preset }}-debug
          --no-tests=error
      - name: Verify checked-in shader fallbacks (Debug)
        if: matrix.configure_preset != 'windows-msvc-server'
        run: >
          cmake --build
          --preset ${{ matrix.configure_preset }}-debug
          --target laiue_verify_shaders
      - name: Build Release
        run: >
          cmake --build
          --preset ${{ matrix.configure_preset }}-release --parallel
      - name: Test Release
        run: >
          ctest --preset ${{ matrix.configure_preset }}-release
          --no-tests=error
      - name: Verify checked-in shader fallbacks (Release)
        if: matrix.configure_preset != 'windows-msvc-server'
        run: >
          cmake --build
          --preset ${{ matrix.configure_preset }}-release
          --target laiue_verify_shaders
      - name: Verify generated sources
        shell: pwsh
        run: |
          git diff --check
          if (git status --porcelain) {
            git status --short
            throw 'Build changed tracked sources'
          }
      - name: Stage release components
        if: matrix.configure_preset == 'windows-msvc'
        shell: pwsh
        run: |
          cmake --build --preset windows-msvc-release --parallel `
            --target laiue_client_bundle laiue_server_bundle laiue_modsdk_bundle
          $client = 'build/windows-msvc/bundles/client/Release'
          $server = 'build/windows-msvc/bundles/server/Release'
          Compress-Archive -Path "$client/*" `
            -DestinationPath "$env:RUNNER_TEMP/laiue-windows-client-x64.zip" -Force
          Compress-Archive -Path "$server/*" `
            -DestinationPath "$env:RUNNER_TEMP/laiue-windows-server-x64.zip" -Force
      - name: Upload Windows client
        if: matrix.configure_preset == 'windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: laiue-windows-client-x64
          path: ${{ runner.temp }}/laiue-windows-client-x64.zip
          if-no-files-found: error
      - name: Upload Windows server
        if: matrix.configure_preset == 'windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: laiue-windows-server-x64
          path: ${{ runner.temp }}/laiue-windows-server-x64.zip
          if-no-files-found: error
      - name: Upload Windows mod stage
        if: matrix.configure_preset == 'windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: mod-stage-windows
          path: build/windows-msvc/bundles/mod-sdk/Release/mods
          if-no-files-found: error
      - name: Upload Windows ModSDK verifier
        if: matrix.configure_preset == 'windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: mod-verifier-windows
          path: |
            build/windows-msvc/bin/Release/laiue_mod_binary_load_test.exe
            build/windows-msvc/bin/Release/laiue_mod_package_hash_test.exe
            build/windows-msvc/bin/Release/laiue_content.dll
          if-no-files-found: error

  debian-server:
    runs-on: ubuntu-latest
    container: debian:13-slim
    strategy:
      fail-fast: false
      matrix:
        configure_preset: [linux-gcc, linux-clang, linux-gcc-asan]
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            ca-certificates clang cmake curl g++ gcc git gnupg \
            libssl-dev ninja-build openssl
          curl --fail --location --silent --show-error \
            --output /tmp/packages-microsoft-prod.deb \
            https://packages.microsoft.com/config/debian/13/packages-microsoft-prod.deb
          dpkg -i /tmp/packages-microsoft-prod.deb
          apt-get update
          apt-get install -y libmsquic=2.5.9
          test "$(dpkg-query -W -f='${Version}' libmsquic)" = 2.5.9
          git clone --filter=blob:none --no-checkout \
            https://github.com/microsoft/msquic.git /tmp/msquic-source
          git -C /tmp/msquic-source fetch --depth 1 origin \
            87b53085d76bd7920d490a6f226c9999b6614d14
          git -C /tmp/msquic-source checkout --detach \
            87b53085d76bd7920d490a6f226c9999b6614d14
          root=/tmp/msquic-install
          mkdir -p "$root/include" "$root/lib"
          cp /tmp/msquic-source/src/inc/msquic*.h \
            /tmp/msquic-source/src/inc/quic_sal_stub.h \
            "$root/include/"
          cp /usr/lib/x86_64-linux-gnu/libmsquic.so.2.5.9 "$root/lib/"
          ln -s libmsquic.so.2.5.9 "$root/lib/libmsquic.so.2"
          ln -s libmsquic.so.2 "$root/lib/libmsquic.so"
          cp /tmp/msquic-source/LICENSE "$root/LICENSE"
          cp /tmp/msquic-source/THIRD-PARTY-NOTICES \
            "$root/THIRD-PARTY-NOTICES"
          echo 2.5.9 > "$root/VERSION"
          echo "LAIUE_MSQUIC_ROOT=$root" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset ${{ matrix.configure_preset }}
      - name: Build Debug
        run: >
          cmake --build
          --preset ${{ matrix.configure_preset }}-debug --parallel
      - name: Test Debug
        run: ctest --preset ${{ matrix.configure_preset }}-debug
      - name: Install smoke test (Debug)
        run: |
          cmake --install build/${{ matrix.configure_preset }} \
            --config Debug \
            --prefix build/install/${{ matrix.configure_preset }}/Debug \
            --component Server
          sh tools/smoke_linux_server.sh \
            build/install/${{ matrix.configure_preset }}/Debug
      - name: Build Release
        if: matrix.configure_preset != 'linux-gcc-asan'
        run: >
          cmake --build
          --preset ${{ matrix.configure_preset }}-release --parallel
      - name: Test Release
        if: matrix.configure_preset != 'linux-gcc-asan'
        run: ctest --preset ${{ matrix.configure_preset }}-release
      - name: Install smoke test (Release)
        if: matrix.configure_preset != 'linux-gcc-asan'
        run: |
          cmake --install build/${{ matrix.configure_preset }} \
            --config Release \
            --prefix build/install/${{ matrix.configure_preset }}/Release \
            --component Server
          sh tools/smoke_linux_server.sh \
            build/install/${{ matrix.configure_preset }}/Release
      - name: Verify generated sources
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Package glibc server
        if: matrix.configure_preset == 'linux-clang'
        run: |
          cmake --build --preset linux-clang-release --parallel \
            --target laiue_server_bundle laiue_modsdk_bundle
          tar -C build/linux-clang/bundles/server/Release \
            -czf /tmp/laiue-linux-x86_64-gnu.tar.gz .
      - name: Upload glibc server
        if: matrix.configure_preset == 'linux-clang'
        uses: actions/upload-artifact@v4
        with:
          name: laiue-linux-x86_64-gnu
          path: /tmp/laiue-linux-x86_64-gnu.tar.gz
          if-no-files-found: error
      - name: Upload glibc mod stage
        if: matrix.configure_preset == 'linux-clang'
        uses: actions/upload-artifact@v4
        with:
          name: mod-stage-gnu
          path: build/linux-clang/bundles/mod-sdk/Release/mods
          if-no-files-found: error
      - name: Upload glibc ModSDK verifier
        if: matrix.configure_preset == 'linux-clang'
        uses: actions/upload-artifact@v4
        with:
          name: mod-verifier-gnu
          path: |
            build/linux-clang/bin/Release/laiue_mod_binary_load_test
            build/linux-clang/bin/Release/laiue_mod_package_hash_test
            build/linux-clang/bin/Release/liblaiue_content.so
          if-no-files-found: error

  alpine-server:
    runs-on: ubuntu-latest
    container: alpine:3.23
    steps:
      - name: Install build dependencies
        run: >
          apk add --no-cache
          bash build-base cmake gcompat git linux-headers ninja
          openssl openssl-dev perl
      - name: Build pinned MsQuic 2.5.9 for musl
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/microsoft/msquic.git /tmp/msquic
          git -C /tmp/msquic fetch --depth 1 origin \
            87b53085d76bd7920d490a6f226c9999b6614d14
          git -C /tmp/msquic checkout --detach \
            87b53085d76bd7920d490a6f226c9999b6614d14
          git -C /tmp/msquic submodule update --init --recursive --depth 1
          cmake -S /tmp/msquic -B /tmp/msquic-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQUIC_BUILD_PERF=OFF \
            -DQUIC_BUILD_SHARED=ON \
            -DQUIC_BUILD_TEST=OFF \
            -DQUIC_BUILD_TOOLS=OFF \
            -DQUIC_EMBED_GIT_HASH=OFF \
            -DQUIC_ENABLE_LOGGING=OFF \
            -DQUIC_LINUX_XDP_ENABLED=OFF \
            -DQUIC_TLS_LIB=quictls
          cmake --build /tmp/msquic-build --target msquic --parallel
          mkdir -p /tmp/msquic-install/include /tmp/msquic-install/lib
          cp /tmp/msquic/src/inc/msquic*.h \
            /tmp/msquic/src/inc/quic_sal_stub.h \
            /tmp/msquic-install/include/
          library="$(find /tmp/msquic-build -type f -name 'libmsquic.so*' | head -n 1)"
          test -n "$library"
          cp "$library" /tmp/msquic-install/lib/libmsquic.so.2.5.9
          ln -s libmsquic.so.2.5.9 /tmp/msquic-install/lib/libmsquic.so.2
          ln -s libmsquic.so.2 /tmp/msquic-install/lib/libmsquic.so
          cp /tmp/msquic/LICENSE /tmp/msquic-install/LICENSE
          cp /tmp/msquic/THIRD-PARTY-NOTICES \
            /tmp/msquic-install/THIRD-PARTY-NOTICES
          echo '2.5.9' > /tmp/msquic-install/VERSION
          echo 'LAIUE_MSQUIC_ROOT=/tmp/msquic-install' >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - name: Configure
        run: >
          cmake --preset linux-musl
          -DLAIUE_MSQUIC_ROOT="$LAIUE_MSQUIC_ROOT"
      - name: Build Debug
        run: cmake --build --preset linux-musl-debug --parallel
      - name: Test Debug
        run: ctest --preset linux-musl-debug
      - name: Install smoke test (Debug)
        run: |
          cmake --install build/linux-musl \
            --config Debug \
            --prefix build/install/linux-musl/Debug \
            --component Server
          sh tools/smoke_linux_server.sh build/install/linux-musl/Debug
      - name: Build Release
        run: cmake --build --preset linux-musl-release --parallel
      - name: Test Release
        run: ctest --preset linux-musl-release
      - name: Install smoke test (Release)
        run: |
          cmake --install build/linux-musl \
            --config Release \
            --prefix build/install/linux-musl/Release \
            --component Server
          sh tools/smoke_linux_server.sh build/install/linux-musl/Release
      - name: Verify generated sources
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Package musl server
        run: |
          cmake --build --preset linux-musl-release --parallel \
            --target laiue_server_bundle laiue_modsdk_bundle
          tar -C build/linux-musl/bundles/server/Release \
            -czf /tmp/laiue-linux-x86_64-musl.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: laiue-linux-x86_64-musl
          path: /tmp/laiue-linux-x86_64-musl.tar.gz
          if-no-files-found: error
      - name: Upload musl mod stage
        uses: actions/upload-artifact@v4
        with:
          name: mod-stage-musl
          path: build/linux-musl/bundles/mod-sdk/Release/mods
          if-no-files-found: error
      - name: Upload musl ModSDK verifier
        uses: actions/upload-artifact@v4
        with:
          name: mod-verifier-musl
          path: |
            build/linux-musl/bin/Release/laiue_mod_binary_load_test
            build/linux-musl/bin/Release/laiue_mod_package_hash_test
            build/linux-musl/bin/Release/liblaiue_content.so
          if-no-files-found: error

  debian-package-smoke:
    runs-on: ubuntu-latest
    needs: debian-server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: laiue-linux-x86_64-gnu
          path: build/package
      - name: Extract release bundle
        run: |
          mkdir -p build/runtime
          tar -xzf build/package/laiue-linux-x86_64-gnu.tar.gz \
            -C build/runtime
      - name: Smoke in clean Debian 13 runtime
        run: |
          docker run --rm \
            -v "$PWD/build/runtime:/opt/laiue:ro" \
            -v "$PWD:/src:ro" \
            debian:13-slim sh -lc '
              apt-get update
              apt-get install -y --no-install-recommends \
                binutils libssl3t64 libnuma1 libxdp1 \
                libnl-route-3-200 openssl
              test ! -e /usr/lib/x86_64-linux-gnu/libmsquic.so.2.5.9
              sh /src/tools/smoke_linux_server.sh /opt/laiue
            '

  alpine-package-smoke:
    runs-on: ubuntu-latest
    needs: alpine-server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: laiue-linux-x86_64-musl
          path: build/package
      - name: Extract release bundle
        run: |
          mkdir -p build/runtime
          tar -xzf build/package/laiue-linux-x86_64-musl.tar.gz \
            -C build/runtime
      - name: Smoke in clean Alpine runtime
        run: |
          docker run --rm \
            -v "$PWD/build/runtime:/opt/laiue:ro" \
            -v "$PWD:/src:ro" \
            alpine:3.23 sh -lc '
              apk add --no-cache \
                binutils libcrypto3 libgcc libssl3 openssl
              test ! -e /usr/lib/libmsquic.so.2.5.9
              sh /src/tools/smoke_linux_server.sh /opt/laiue
            '

  mod-sdk:
    runs-on: ubuntu-latest
    needs: [windows-build, debian-server, alpine-server]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: mod-stage-windows
          path: build/mod-stages/windows
      - uses: actions/download-artifact@v4
        with:
          name: mod-stage-gnu
          path: build/mod-stages/gnu
      - uses: actions/download-artifact@v4
        with:
          name: mod-stage-musl
          path: build/mod-stages/musl
      - name: Assemble multi-platform ModSDK
        run: |
          cmake \
            -DSOURCE_ROOT="$GITHUB_WORKSPACE" \
            -DWINDOWS_STAGE="$GITHUB_WORKSPACE/build/mod-stages/windows" \
            -DGNU_STAGE="$GITHUB_WORKSPACE/build/mod-stages/gnu" \
            -DMUSL_STAGE="$GITHUB_WORKSPACE/build/mod-stages/musl" \
            -DOUTPUT_DIRECTORY="$GITHUB_WORKSPACE/build/mod-sdk" \
            -P cmake/AssembleModSdk.cmake
          test -s build/mod-sdk/LICENSE
          test -s build/mod-sdk/docs/modding.md
          test "$(find build/mod-sdk/mods -mindepth 1 -maxdepth 1 \
            -type d -name '*.lmp' | wc -l)" -gt 0
          tar -C build/mod-sdk -czf /tmp/laiue-mod-sdk-x86_64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: laiue-mod-sdk-x86_64
          path: /tmp/laiue-mod-sdk-x86_64.tar.gz
          if-no-files-found: error

  mod-sdk-verify-windows:
    runs-on: windows-latest
    needs: mod-sdk
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: laiue-mod-sdk-x86_64
          path: ${{ runner.temp }}/mod-sdk-package
      - uses: actions/download-artifact@v4
        with:
          name: mod-verifier-windows
          path: ${{ runner.temp }}/mod-sdk
      - name: Verify complete ModSDK on Windows
        shell: pwsh
        run: |
          tar -xzf `
            "$env:RUNNER_TEMP/mod-sdk-package/laiue-mod-sdk-x86_64.tar.gz" `
            -C "$env:RUNNER_TEMP/mod-sdk"
          $hashDirectory = Join-Path $env:RUNNER_TEMP 'mod-hashes'
          New-Item -ItemType Directory -Force $hashDirectory | Out-Null
          $env:LAIUE_MOD_HASH_OUTPUT = Join-Path $hashDirectory 'windows.txt'
          & "$env:RUNNER_TEMP/mod-sdk/laiue_mod_binary_load_test.exe"
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows ModSDK binary load verification failed'
          }
          & "$env:RUNNER_TEMP/mod-sdk/laiue_mod_package_hash_test.exe"
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows ModSDK package hash verification failed'
          }
          if (!(Test-Path $env:LAIUE_MOD_HASH_OUTPUT) -or
              (Get-Item $env:LAIUE_MOD_HASH_OUTPUT).Length -eq 0) {
            throw 'Windows ModSDK package hash is empty'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: mod-hash-windows
          path: ${{ runner.temp }}/mod-hashes/windows.txt
          if-no-files-found: error

  mod-sdk-verify-gnu:
    runs-on: ubuntu-latest
    container: debian:13-slim
    needs: mod-sdk
    steps:
      - name: Install verifier runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libssl3t64
      - uses: actions/download-artifact@v4
        with:
          name: laiue-mod-sdk-x86_64
          path: /tmp/mod-sdk-package
      - uses: actions/download-artifact@v4
        with:
          name: mod-verifier-gnu
          path: /tmp/mod-sdk
      - name: Verify complete ModSDK on glibc
        run: |
          tar -xzf /tmp/mod-sdk-package/laiue-mod-sdk-x86_64.tar.gz \
            -C /tmp/mod-sdk
          chmod 0755 \
            /tmp/mod-sdk/laiue_mod_binary_load_test \
            /tmp/mod-sdk/laiue_mod_package_hash_test
          mkdir -p /tmp/mod-hashes
          export LD_LIBRARY_PATH=/tmp/mod-sdk
          export LAIUE_MOD_HASH_OUTPUT=/tmp/mod-hashes/gnu.txt
          /tmp/mod-sdk/laiue_mod_binary_load_test
          /tmp/mod-sdk/laiue_mod_package_hash_test
          test -s "$LAIUE_MOD_HASH_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mod-hash-gnu
          path: /tmp/mod-hashes/gnu.txt
          if-no-files-found: error

  mod-sdk-verify-musl:
    runs-on: ubuntu-latest
    container: alpine:3.23
    needs: mod-sdk
    steps:
      - name: Install verifier runtime dependencies
        run: apk add --no-cache libcrypto3 libgcc
      - uses: actions/download-artifact@v4
        with:
          name: laiue-mod-sdk-x86_64
          path: /tmp/mod-sdk-package
      - uses: actions/download-artifact@v4
        with:
          name: mod-verifier-musl
          path: /tmp/mod-sdk
      - name: Verify complete ModSDK on musl
        run: |
          tar -xzf /tmp/mod-sdk-package/laiue-mod-sdk-x86_64.tar.gz \
            -C /tmp/mod-sdk
          chmod 0755 \
            /tmp/mod-sdk/laiue_mod_binary_load_test \
            /tmp/mod-sdk/laiue_mod_package_hash_test
          mkdir -p /tmp/mod-hashes
          export LD_LIBRARY_PATH=/tmp/mod-sdk
          export LAIUE_MOD_HASH_OUTPUT=/tmp/mod-hashes/musl.txt
          /tmp/mod-sdk/laiue_mod_binary_load_test
          /tmp/mod-sdk/laiue_mod_package_hash_test
          test -s "$LAIUE_MOD_HASH_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mod-hash-musl
          path: /tmp/mod-hashes/musl.txt
          if-no-files-found: error

  mod-sdk-hash-consistency:
    runs-on: ubuntu-latest
    needs:
      [mod-sdk-verify-windows, mod-sdk-verify-gnu,
       mod-sdk-verify-musl]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mod-hash-windows
          path: build/mod-hashes/windows
      - uses: actions/download-artifact@v4
        with:
          name: mod-hash-gnu
          path: build/mod-hashes/gnu
      - uses: actions/download-artifact@v4
        with:
          name: mod-hash-musl
          path: build/mod-hashes/musl
      - name: Compare cross-platform package hashes
        run: |
          test -s build/mod-hashes/windows/windows.txt
          test -s build/mod-hashes/gnu/gnu.txt
          test -s build/mod-hashes/musl/musl.txt
          cmp build/mod-hashes/windows/windows.txt \
            build/mod-hashes/gnu/gnu.txt
          cmp build/mod-hashes/windows/windows.txt \
            build/mod-hashes/musl/musl.txt
