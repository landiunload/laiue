name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Версии тулчейнов, общие для нескольких jobs.
env:
  LLVM_VERSION: '22'
  ANDROID_NDK_VERSION: 30.0.16248370
  # DXC собирает встроенные шейдеры; checked-in байткод обязан совпадать
  # с выводом именно этого релиза.
  DXC_RELEASE: v1.9.2609
  DXC_WINDOWS_ASSET: dxc_2026_09_29.zip
  DXC_WINDOWS_SHA256: ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1
  DXC_LINUX_ASSET: linux_dxc_2026_09_28.x86_x64.tar.gz
  DXC_LINUX_SHA256: 96faadc7f5c282d2ffda49804beb4c3ee38127bc252b723234e3c5cdf7aa39a1

jobs:
  windows-engine:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-msvc, windows-clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activate x64 compiler environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (!$vsRoot) { throw 'Visual Studio x64 C tools were not found' }
          $vsRoot = @($vsRoot)[0].Trim()
          Import-Module (Join-Path $vsRoot `
            'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsRoot `
            -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          # CMake из Visual Studio отстаёт от установленного на раннере.
          $env:PATH = ($env:PATH -split ';' |
            Where-Object { $_ -notlike '*\Microsoft\CMake\*' }) -join ';'
          cmake --version
          foreach ($name in 'INCLUDE', 'LIB', 'LIBPATH', 'PATH') {
            "$name=$([Environment]::GetEnvironmentVariable($name))" |
              Out-File $env:GITHUB_ENV -Append
          }
      - &install-windows-dxc
        name: Install pinned DXC
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'dxc.zip'
          curl.exe --fail --location --retry 3 --retry-all-errors --output $archive `
            "https://github.com/microsoft/DirectXShaderCompiler/releases/download/$env:DXC_RELEASE/$env:DXC_WINDOWS_ASSET"
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $env:DXC_WINDOWS_SHA256) {
            throw 'DXC archive checksum mismatch'
          }
          Expand-Archive $archive (Join-Path $env:RUNNER_TEMP 'dxc')
          $architecture = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          $dxc = Join-Path $env:RUNNER_TEMP "dxc\bin\$architecture\dxc.exe"
          & $dxc --version
          "LAIUE_DXC=$dxc" | Out-File $env:GITHUB_ENV -Append
      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }} -DLAIUE_BUILD_EXAMPLES=ON
          -DLAIUE_REQUIRE_D3D12_TEST_DRIVER=ON
          "-DLAIUE_DXC=$env:LAIUE_DXC" -DLAIUE_REQUIRE_SHADER_COMPILER=ON
      - name: Build Debug
        run: cmake --build --preset ${{ matrix.preset }}-debug --parallel
      - name: Test Debug
        run: ctest --preset ${{ matrix.preset }}-debug --parallel --no-tests=error
      - name: Verify checked-in shaders
        run: >
          cmake --build --preset ${{ matrix.preset }}-debug
          --target laiue_verify_shaders
      - name: Build Release
        run: cmake --build --preset ${{ matrix.preset }}-release --parallel
      - name: Test Release
        run: ctest --preset ${{ matrix.preset }}-release --parallel --no-tests=error
      - name: Verify animation window presentation
        shell: pwsh
        run: |
          foreach ($configuration in 'Debug', 'Release') {
            ./tools/test_animation_window.ps1 `
              -DemoExe "build/${{ matrix.preset }}/bin/$configuration/laiue_animation_demo.exe" `
              -OutputDir "build/${{ matrix.preset }}/animation-window/$configuration"
          }
      - name: Verify native walk scenario and GPU captures
        id: walk-scenario
        shell: pwsh
        timeout-minutes: 8
        run: |
          foreach ($configuration in 'Debug', 'Release') {
            ./tools/test_walk_fallback.ps1 `
              -GameExe "build/${{ matrix.preset }}/bin/$configuration/laiue_walk.exe" `
              -OutputDir "build/${{ matrix.preset }}/walk-scenario/fallback/$configuration"
            ./tools/test_windows_walk.ps1 `
              -GameExe "build/${{ matrix.preset }}/bin/$configuration/laiue_walk.exe" `
              -FrameCheckExe "build/${{ matrix.preset }}/bin/$configuration/laiue_frame_check.exe" `
              -OutputDir "build/${{ matrix.preset }}/walk-scenario/$configuration" `
              -TimeoutSeconds 180
          }
      - name: Upload native walk captures and measurements
        if: always() && steps.walk-scenario.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laiue-walk-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/walk-scenario/**/*.png
            build/${{ matrix.preset }}/walk-scenario/**/*.json
            build/${{ matrix.preset }}/walk-scenario/**/*.log
          if-no-files-found: error
      - name: Stage engine SDK
        if: matrix.preset == 'windows-msvc'
        run: >
          cmake --build --preset windows-msvc-release
          --target laiue_engine_bundle
      - name: Upload Windows engine SDK
        if: matrix.preset == 'windows-msvc'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laiue-engine-windows-x86_64
          path: build/windows-msvc/bundles/engine/Release
          if-no-files-found: error
      - name: Verify build did not modify sources
        run: >
          cmake "-DSOURCE_ROOT=$env:GITHUB_WORKSPACE"
          -P tools/verify_source_tree.cmake

  windows-arm64-engine:
    name: Windows ARM64 engine (${{ matrix.preset }})
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-msvc-arm64, windows-clang-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activate ARM64 compiler environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            -property installationPath
          if (!$vsRoot) { throw 'Visual Studio ARM64 C tools were not found' }
          $vsRoot = @($vsRoot)[0].Trim()
          Import-Module (Join-Path $vsRoot `
            'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsRoot `
            -SkipAutomaticLocation -DevCmdArguments '-arch=arm64 -host_arch=arm64'
          # CMake из Visual Studio отстаёт от установленного на раннере.
          $env:PATH = ($env:PATH -split ';' |
            Where-Object { $_ -notlike '*\Microsoft\CMake\*' }) -join ';'
          cmake --version
          foreach ($name in 'INCLUDE', 'LIB', 'LIBPATH', 'PATH') {
            "$name=$([Environment]::GetEnvironmentVariable($name))" |
              Out-File $env:GITHUB_ENV -Append
          }
      - name: Confirm the runner is native ARM64
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') {
            throw "Expected an ARM64 runner, got $env:PROCESSOR_ARCHITECTURE"
          }
      - *install-windows-dxc
      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }} -DLAIUE_BUILD_EXAMPLES=ON
          "-DLAIUE_DXC=$env:LAIUE_DXC" -DLAIUE_REQUIRE_SHADER_COMPILER=ON
      - name: Build Debug
        run: cmake --build --preset ${{ matrix.preset }}-debug --parallel
      - name: Test Debug
        run: ctest --preset ${{ matrix.preset }}-debug --parallel --no-tests=error
      - name: Verify checked-in shaders
        run: >
          cmake --build --preset ${{ matrix.preset }}-debug
          --target laiue_verify_shaders
      - name: Build Release
        run: cmake --build --preset ${{ matrix.preset }}-release --parallel
      - name: Test Release
        run: ctest --preset ${{ matrix.preset }}-release --parallel --no-tests=error
      - name: Stage engine SDK
        if: matrix.preset == 'windows-msvc-arm64'
        run: >
          cmake --build --preset windows-msvc-arm64-release
          --target laiue_engine_bundle
      - name: Upload Windows ARM64 engine SDK
        if: matrix.preset == 'windows-msvc-arm64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laiue-engine-windows-arm64
          path: build/windows-msvc-arm64/bundles/engine/Release
          if-no-files-found: error
      - name: Verify ARMv8.0 compatibility profile
        if: matrix.preset == 'windows-msvc-arm64'
        shell: pwsh
        run: |
          cmake --preset windows-msvc-arm64 -B build/windows-msvc-arm64-armv8.0 `
            "-DLAIUE_WINDOWS_ARM64_BASELINE=armv8.0" -DLAIUE_BUILD_EXAMPLES=ON `
            "-DLAIUE_DXC=$env:LAIUE_DXC" -DLAIUE_REQUIRE_SHADER_COMPILER=ON
          if ($LASTEXITCODE -ne 0) { throw 'ARMv8.0 configure failed' }
          foreach ($configuration in 'Debug', 'Release') {
            cmake --build build/windows-msvc-arm64-armv8.0 --config $configuration --parallel
            if ($LASTEXITCODE -ne 0) { throw "ARMv8.0 $configuration build failed" }
            ctest --test-dir build/windows-msvc-arm64-armv8.0 -C $configuration `
              --parallel --output-on-failure --no-tests=error
            if ($LASTEXITCODE -ne 0) { throw "ARMv8.0 $configuration tests failed" }
          }
      - name: Verify build did not modify sources
        run: >
          cmake "-DSOURCE_ROOT=$env:GITHUB_WORKSPACE"
          -P tools/verify_source_tree.cmake

  linux-engine:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-gcc, linux-clang, linux-gcc-asan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the pinned Clang
        if: matrix.preset == 'linux-clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "clang-$LLVM_VERSION" "llvm-$LLVM_VERSION" "lld-$LLVM_VERSION" "libclang-rt-$LLVM_VERSION-dev"
          sudo update-alternatives --install /usr/bin/clang clang "/usr/bin/clang-$LLVM_VERSION" 200
          clang --version
      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DLAIUE_BUILD_GRAPHICS=OFF -DLAIUE_BUILD_EXAMPLES=ON
          -DLAIUE_BUILD_BENCHMARKS=${{ matrix.preset == 'linux-gcc' && 'ON' || 'OFF' }}
      - name: Build Debug
        run: cmake --build --preset ${{ matrix.preset }}-debug --parallel
      - name: Compile manual benchmarks (Debug)
        if: matrix.preset == 'linux-gcc'
        run: >
          cmake --build --preset linux-gcc-debug --parallel
          --target laiue_benchmarks
      - name: Test Debug
        run: ctest --preset ${{ matrix.preset }}-debug --parallel --no-tests=error
      - name: Build Release
        if: matrix.preset != 'linux-gcc-asan'
        run: cmake --build --preset ${{ matrix.preset }}-release --parallel
      - name: Compile manual benchmarks (Release)
        if: matrix.preset == 'linux-gcc'
        run: >
          cmake --build --preset linux-gcc-release --parallel
          --target laiue_benchmarks
      - name: Test Release
        if: matrix.preset != 'linux-gcc-asan'
        run: ctest --preset ${{ matrix.preset }}-release --parallel --no-tests=error
      - name: Compile-test external static core seam
        if: matrix.preset == 'linux-gcc'
        run: |
          cmake --preset linux-external-port-smoke
          cmake --build --preset linux-external-port-smoke-release --parallel
          ctest --preset linux-external-port-smoke-release --parallel --no-tests=error
      - name: Stage engine SDK
        if: matrix.preset == 'linux-clang'
        run: >
          cmake --build --preset linux-clang-release
          --target laiue_engine_bundle
      - name: Upload Linux engine SDK
        if: matrix.preset == 'linux-clang'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laiue-engine-linux-gnu-x86_64
          path: build/linux-clang/bundles/engine/Release
          if-no-files-found: error
      - name: Verify build did not modify sources
        run: |
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" \
            -P tools/verify_source_tree.cmake

  linux-fuzz-corpus:
    name: Linux parser fuzz corpus (Clang)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the pinned Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "clang-$LLVM_VERSION" "llvm-$LLVM_VERSION" "lld-$LLVM_VERSION" "libclang-rt-$LLVM_VERSION-dev"
          sudo update-alternatives --install /usr/bin/clang clang "/usr/bin/clang-$LLVM_VERSION" 200
          clang --version
      - name: Configure
        run: cmake --preset linux-clang-fuzz
      # Движок собран с ASan/UBSan и покрытием libFuzzer; каждый фаззер
      # повторяет семена и входы, однажды ронявшие разборщик.
      - name: Build fuzzers
        run: >
          cmake --build --preset linux-clang-fuzz-debug --parallel
          --target laiue_fuzzers
      - name: Replay seed and regression corpus
        run: ctest --preset linux-clang-fuzz-debug -R '^laiue[.]fuzz[.]' --parallel --no-tests=error
      - name: Verify build did not modify sources
        run: |
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" \
            -P tools/verify_source_tree.cmake

  linux-vulkan-engine:
    name: Linux Vulkan offscreen renderer
    runs-on: ubuntu-26.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers \
            libx11-dev xvfb xauth
      - name: Install pinned DXC
        run: |
          curl --fail --location --connect-timeout 20 --max-time 180 --retry 3 --retry-all-errors \
            "https://github.com/microsoft/DirectXShaderCompiler/releases/download/$DXC_RELEASE/$DXC_LINUX_ASSET" \
            --output "$RUNNER_TEMP/dxc.tar.gz"
          printf '%s  %s\n' "$DXC_LINUX_SHA256" "$RUNNER_TEMP/dxc.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/dxc"
          tar -xzf "$RUNNER_TEMP/dxc.tar.gz" -C "$RUNNER_TEMP/dxc"
          dxc="$(find "$RUNNER_TEMP/dxc" -type f -name dxc -perm -u+x | head -n 1)"
          "$dxc" --version
          echo "LAIUE_DXC=$dxc" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # С заголовками X11 профиль собирает и X11-окно с вводом: без них
      # эти модули выпадали из сборки, и их поломка оставалась незамеченной.
      - name: Configure
        run: >
          cmake --preset linux-vulkan-offscreen
          -DLAIUE_REQUIRE_VULKAN_TEST_DRIVER=ON -DLAIUE_BUILD_EXAMPLES=ON
          "-DLAIUE_DXC=$LAIUE_DXC" -DLAIUE_REQUIRE_SHADER_COMPILER=ON
      - name: Build Debug
        run: cmake --build --preset linux-vulkan-offscreen-debug --parallel
      # Кадр рисуется программным драйвером Mesa: GPU у раннера нет, но
      # рендер проверяется по пикселям, а не только по кодам возврата.
      # Слои Khronos превращают неверное использование Vulkan в ошибку —
      # без них драйвер молча прощает часть нарушений спецификации.
      - name: Test Debug on lavapipe
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          VK_LOADER_LAYERS_ENABLE: VK_LAYER_KHRONOS_validation
        run: ctest --preset linux-vulkan-offscreen-debug --parallel --no-tests=error
      # --frames требует настоящее окно, успешные Device V2 submissions и
      # непустую геометрию. Отсутствие X11 не превращает smoke в успешный skip.
      - name: Smoke mesh-world X11 presentation on lavapipe (Debug)
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          VK_LOADER_LAYERS_ENABLE: VK_LAYER_KHRONOS_validation
        run: >
          timeout 60s xvfb-run -a -s '-screen 0 960x540x24'
          build/linux-vulkan-offscreen/bin/Debug/laiue_mesh_world_demo --frames 12
      - name: Smoke animation X11 presentation on lavapipe (Debug)
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          VK_LOADER_LAYERS_ENABLE: VK_LAYER_KHRONOS_validation
          LAIUE_ANIMATION_DEMO_MODE: window
          LAIUE_ANIMATION_REQUIRE_FULL: '1'
          LAIUE_ANIMATION_REQUIRE_WINDOW: '1'
          LAIUE_ANIMATION_WINDOW_FRAMES: '12'
        run: >
          timeout 60s xvfb-run -a -s '-screen 0 960x540x24'
          build/linux-vulkan-offscreen/bin/Debug/laiue_animation_demo
      - name: Build Release
        run: cmake --build --preset linux-vulkan-offscreen-release --parallel
      - name: Test Release on lavapipe
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          VK_LOADER_LAYERS_ENABLE: VK_LAYER_KHRONOS_validation
        run: ctest --preset linux-vulkan-offscreen-release --parallel --no-tests=error
      - name: Smoke mesh-world X11 presentation on lavapipe (Release)
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          VK_LOADER_LAYERS_ENABLE: VK_LAYER_KHRONOS_validation
        run: >
          timeout 60s xvfb-run -a -s '-screen 0 960x540x24'
          build/linux-vulkan-offscreen/bin/Release/laiue_mesh_world_demo --frames 12
      - name: Smoke animation X11 presentation on lavapipe (Release)
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          VK_LOADER_LAYERS_ENABLE: VK_LAYER_KHRONOS_validation
          LAIUE_ANIMATION_DEMO_MODE: window
          LAIUE_ANIMATION_REQUIRE_FULL: '1'
          LAIUE_ANIMATION_REQUIRE_WINDOW: '1'
          LAIUE_ANIMATION_WINDOW_FRAMES: '12'
        run: >
          timeout 60s xvfb-run -a -s '-screen 0 960x540x24'
          build/linux-vulkan-offscreen/bin/Release/laiue_animation_demo
      # Checked-in SPIR-V обязан совпадать с тем, что DXC выдаёт из HLSL:
      # иначе сборка без компилятора шейдеров получила бы другой рендер,
      # чем сборка с ним.
      - name: Verify checked-in SPIR-V matches the HLSL sources
        run: >
          cmake --build build/linux-vulkan-offscreen
          --target laiue_verify_shaders
      - name: Verify build did not modify sources
        run: |
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" \
            -P tools/verify_source_tree.cmake

  linux-arm64-engine:
    name: Linux ARM64 core (GCC)
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure headless core
        run: |
          test "$(uname -m)" = aarch64
          cmake --preset linux-gcc-arm64 -DLAIUE_BUILD_EXAMPLES=ON
      - name: Build and test Debug
        run: |
          cmake --build --preset linux-gcc-arm64-debug --parallel
          ctest --preset linux-gcc-arm64-debug --parallel --no-tests=error
      - name: Build and test Release
        run: |
          cmake --build --preset linux-gcc-arm64-release --parallel
          ctest --preset linux-gcc-arm64-release --parallel --no-tests=error
      - name: Stage engine SDK
        run: >
          cmake --build --preset linux-gcc-arm64-release
          --target laiue_engine_bundle --parallel
      - name: Upload Linux ARM64 engine SDK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laiue-engine-linux-gnu-arm64
          path: build/linux-gcc-arm64/bundles/engine/Release
          if-no-files-found: error
      - name: Verify build did not modify sources
        run: |
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" \
            -P tools/verify_source_tree.cmake

  musl-engine:
    runs-on: ubuntu-26.04
    container: alpine:3.24
    steps:
      - name: Install build dependencies
        run: >
          apk add --no-cache build-base cmake git ninja
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: >
          cmake --preset linux-musl
          -DLAIUE_BUILD_GRAPHICS=OFF -DLAIUE_BUILD_EXAMPLES=ON
      - name: Build and test Debug
        run: |
          cmake --build --preset linux-musl-debug --parallel
          ctest --preset linux-musl-debug --parallel --no-tests=error
      - name: Build and test Release
        run: |
          cmake --build --preset linux-musl-release --parallel
          ctest --preset linux-musl-release --parallel --no-tests=error
      - name: Verify build did not modify sources
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" \
            -P tools/verify_source_tree.cmake

  android-arm64-engine:
    name: Android ARM64 core/link
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Android NDK
        run: |
          # Загрузка с dl.google.com изредка обрывается (Premature EOF).
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null && break
            echo "::warning::NDK download attempt $attempt failed"
            sleep 20
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          test -f "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/build/cmake/android.toolchain.cmake"
      - name: Verify complete Android static-link closure
        run: |
          cmake --preset android-arm64-core-closure
          cmake --build --preset android-arm64-core-closure --parallel
      - name: Configure Android core
        run: cmake --preset android-arm64-core
      - name: Compile and link Android targets
        run: cmake --build --preset android-arm64-core-release --parallel
      # Пример NativeActivity делит с desktop-walk код ragdoll и выбор
      # модулей; без этой сборки его поломка оставалась бы незамеченной.
      - name: Compile and link Android walk example
        run: |
          cmake --preset android-arm64-walk
          cmake --build --preset android-arm64-walk-release --parallel
      # Модули — отдельные .so, которые программа грузит по имени, как DLL
      # на настольных системах.
      - name: Compile and link Android programs on modules by name
        run: |
          cmake --preset android-arm64-shared -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build --preset android-arm64-shared-release --parallel
      # Linux-анализ не видит код под __ANDROID__ и ветки ARM64; база этой
      # сборки проверяет их тем же .clang-tidy.
      - name: Run clang-tidy on the Android sources
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "clang-tidy-$LLVM_VERSION"
          run-clang-tidy-"$LLVM_VERSION" -p build/android-arm64-shared -quiet -j "$(nproc)" \
            "$GITHUB_WORKSPACE/src/.*[.]c$"
      - name: Verify build did not modify sources
        run: |
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" \
            -P tools/verify_source_tree.cmake

  android-emulator-runtime:
    name: Android native Vulkan runtime
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      LAIUE_ANDROID_IMAGE: android-37.0
      LAIUE_BUILD_TOOLS: 37.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install emulator runtime dependencies
        timeout-minutes: 3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0 libx11-dev libx11-xcb-dev
      - name: Build the shared image checker for the host
        timeout-minutes: 6
        run: |
          cmake --preset linux-gcc -B build/android-emulator-host \
            -DLAIUE_BUILD_GRAPHICS=OFF -DLAIUE_BUILD_EXAMPLES=OFF \
            -DLAIUE_BUILD_TOOLS=ON -DBUILD_TESTING=OFF \
            -DLAIUE_ENABLE_SDK_INSTALL=OFF
          cmake --build build/android-emulator-host --config Release \
            --target laiue_frame_check --parallel
      - name: Prepare pinned Android tools and the test image
        id: prepare-runtime
        timeout-minutes: 12
        run: |
          mkdir -p build/android-runtime-results "$RUNNER_TEMP/laiue-sdk-tools" \
            "$RUNNER_TEMP/laiue-pinned-emulator" "$RUNNER_TEMP/laiue-avd"
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/emu-update-last-check.ini"
          printf 'ANDROID_AVD_HOME=%s/laiue-avd\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          curl --fail --location --connect-timeout 20 --max-time 180 --retry 3 --retry-all-errors \
            https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip \
            --output "$RUNNER_TEMP/laiue-sdk-tools.zip"
          printf '0877a1d048fe4a24efe2eff536ca4223f7adeb58648bb81909d33c446918cfa8  %s\n' \
            "$RUNNER_TEMP/laiue-sdk-tools.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/laiue-sdk-tools.zip" -d "$RUNNER_TEMP/laiue-sdk-tools"
          tools="$RUNNER_TEMP/laiue-sdk-tools/cmdline-tools/bin"
          grep -Fx 'Pkg.Revision=23.0' "$tools/../source.properties"
          "$tools/android" --no-metrics --sdk="$ANDROID_HOME" --version \
            > build/android-runtime-results/tool-versions.txt
          for ((answer=0; answer<32; ++answer)); do printf 'y\n'; done \
            > "$RUNNER_TEMP/laiue-sdk-answers.txt"
          # Загрузка с dl.google.com изредка обрывается (Premature EOF).
          retry() {
            for attempt in 1 2 3; do
              "$@" < "$RUNNER_TEMP/laiue-sdk-answers.txt" && return
              echo "::warning::Attempt $attempt failed: $*"
              sleep 20
            done
            return 1
          }
          for package in platforms/$LAIUE_ANDROID_IMAGE build-tools/$LAIUE_BUILD_TOOLS \
            system-images/$LAIUE_ANDROID_IMAGE/google_apis/x86_64 "ndk/$ANDROID_NDK_VERSION"; do
            retry "$tools/android" --no-metrics --sdk="$ANDROID_HOME" sdk install "$package"
          done
          ndk="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          test -f "$ndk/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          curl --fail --location --connect-timeout 20 --max-time 180 --retry 3 --retry-all-errors \
            https://dl.google.com/android/repository/emulator-linux_x64-16428233.zip \
            --output "$RUNNER_TEMP/laiue-emulator.zip"
          printf 'b08fc43d8608d2955f607f1b287beb525041e730086bdca3af152accac3af9c1  %s\n' \
            "$RUNNER_TEMP/laiue-emulator.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/laiue-emulator.zip" -d "$RUNNER_TEMP/laiue-pinned-emulator"
          emulator="$RUNNER_TEMP/laiue-pinned-emulator/emulator"
          grep -Fx 'Pkg.Revision=37.2.12' "$emulator/source.properties"
          grep -Fx 'Pkg.BuildId=16428233' "$emulator/source.properties"
          "$emulator/emulator" -version >> build/android-runtime-results/tool-versions.txt
          printf '\nNDK: %s; build-tools: %s\n' "$ANDROID_NDK_VERSION" "$LAIUE_BUILD_TOOLS" \
            >> build/android-runtime-results/tool-versions.txt
          cat "$ANDROID_HOME/system-images/$LAIUE_ANDROID_IMAGE/google_apis/x86_64/source.properties" \
            >> build/android-runtime-results/tool-versions.txt
          keytool -genkeypair -keystore "$RUNNER_TEMP/laiue-ci-debug.p12" \
            -storetype PKCS12 -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 \
            -dname 'CN=Android Debug,O=Android,C=US'
      - name: Build and sign the native test APKs
        timeout-minutes: 12
        run: |
          tools="$ANDROID_HOME/build-tools/$LAIUE_BUILD_TOOLS"
          sdk_options=(
            -DLAIUE_ANDROID_AAPT2="$tools/aapt2"
            -DLAIUE_ANDROID_ZIPALIGN="$tools/zipalign"
            -DLAIUE_ANDROID_APKSIGNER="$tools/apksigner"
            -DLAIUE_ANDROID_FRAMEWORK_JAR="$ANDROID_HOME/platforms/$LAIUE_ANDROID_IMAGE/android.jar"
            -DLAIUE_ANDROID_KEYSTORE="$RUNNER_TEMP/laiue-ci-debug.p12"
          )
          cmake --preset android-x86_64-walk "${sdk_options[@]}"
          cmake --build build/android-x86_64-walk --config Release \
            --target laiue_walk_android_apk --parallel
          # Программа на модулях по имени: окно, ввод, интерфейс и Vulkan —
          # отдельные .so в APK.
          cmake --preset android-x86_64-shared "${sdk_options[@]}"
          cmake --build build/android-x86_64-shared --config Release \
            --target laiue_viewer_apk --parallel
      - name: Boot the emulator with software Vulkan
        id: emulator
        timeout-minutes: 4
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test "$ANDROID_AVD_HOME" = "$RUNNER_TEMP/laiue-avd"
          boot_deadline=$((SECONDS + 180))
          emulator="$RUNNER_TEMP/laiue-pinned-emulator/emulator/emulator"
          timeout 15s "$emulator" -accel-check
          # Android CLI create selects its own image from a device profile.
          # Write the AOSP AVD layout to preserve the pinned system image.
          avd_dir="$ANDROID_AVD_HOME/laiue-ci.avd"
          mkdir -p "$avd_dir"
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=%s\n' \
            "$avd_dir" "$LAIUE_ANDROID_IMAGE" > "$ANDROID_AVD_HOME/laiue-ci.ini"
          cat > "$avd_dir/config.ini" <<CONFIG
          AvdId=laiue-ci
          avd.ini.displayname=laiue-ci
          avd.ini.encoding=UTF-8
          abi.type=x86_64
          hw.cpu.arch=x86_64
          hw.cpu.ncore=2
          hw.ramSize=2048
          vm.heapSize=256
          disk.dataPartition.size=2G
          hw.keyboard=yes
          hw.mainKeys=no
          hw.accelerometer=yes
          hw.sensors.orientation=yes
          hw.initialOrientation=portrait
          hw.lcd.width=1080
          hw.lcd.height=1920
          hw.lcd.density=420
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader
          hw.camera.back=none
          hw.camera.front=none
          fastboot.forceColdBoot=yes
          image.sysdir.1=$ANDROID_HOME/system-images/$LAIUE_ANDROID_IMAGE/google_apis/x86_64/
          tag.id=google_apis
          tag.display=Google APIs
          CONFIG
          "$emulator" -list-avds | grep -Fx laiue-ci
          setsid timeout --signal=TERM --kill-after=10s 600s "$emulator" \
            -avd laiue-ci -no-metrics -no-snapshot -no-boot-anim -no-audio -no-window \
            -gpu swiftshader -accel on -port 5554 -cores 2 -memory 2048 \
            > build/android-runtime-results/emulator.log 2>&1 &
          printf '%s\n' "$!" > "$RUNNER_TEMP/laiue-emulator.pid"
          adb="$ANDROID_HOME/platform-tools/adb"
          timeout 90s "$adb" -s emulator-5554 wait-for-device
          until [ "$(timeout 5s "$adb" -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; do
            if [ "$SECONDS" -ge "$boot_deadline" ]; then
              cat build/android-runtime-results/emulator.log
              exit 1
            fi
            sleep 2
          done
          timeout 10s "$adb" -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
          timeout 10s "$adb" -s emulator-5554 shell wm dismiss-keyguard
      - name: Verify native Android gameplay, rotation and resume
        timeout-minutes: 6
        shell: pwsh
        run: |
          ./tools/test_android_walk.ps1 `
            -AdbPath "$env:ANDROID_HOME/platform-tools/adb" `
            -Serial emulator-5554 `
            -Apk build/android-x86_64-walk/android/laiue_walk_android_apk.apk `
            -FrameCheckExe build/android-emulator-host/bin/Release/laiue_frame_check `
            -OutputDir build/android-runtime-results/captures `
            -TimeoutSeconds 240
      - name: Verify a program on modules by name draws on Android
        timeout-minutes: 5
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          log=build/android-runtime-results/viewer.log
          viewer=dev.laiue.viewer/android.app.NativeActivity
          fail() {
            echo "$1"
            cat "$log"
            timeout 10s "$adb" -s emulator-5554 logcat -d -b crash || true
            exit 1
          }
          # Ждёт, пока строк с текстом $1 в журнале viewer станет не меньше $2.
          expect_lines() {
            until timeout 10s "$adb" -s emulator-5554 logcat -d -s dev.laiue.viewer:V > "$log" \
                && [ "$(grep -Fc "$1" "$log")" -ge "$2" ]; do
              if grep -Fq 'main returned' "$log"; then
                fail "a run of the viewer failed"
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                fail "expected $2 lines with: $1"
              fi
              sleep 0.5
            done
          }
          viewer_process() {
            timeout 10s "$adb" -s emulator-5554 shell pidof dev.laiue.viewer | tr -d '\r'
          }
          timeout 60s "$adb" -s emulator-5554 install -r \
            build/android-x86_64-shared/android/laiue_viewer_apk.apk
          timeout 10s "$adb" -s emulator-5554 logcat -c
          deadline=$((SECONDS + 200))
          # --smoke читает кадр с GPU и сравнивает центр с углом: картинка
          # должна быть на экране, а не только в памяти.
          timeout 30s "$adb" -s emulator-5554 shell am start -W -n "$viewer" --es args --smoke \
            || fail "the viewer did not start"
          expect_lines 'viewer: the picture is on screen' 1
          expect_lines 'its activity is closing' 1
          process="$(viewer_process)" || fail "the viewer process is gone"
          # Android оставляет процесс, и следующие запуски идут в нём же.
          # --activity-clear-task закрывает работающий viewer, но замену
          # создаёт раньше, чем уничтожит его: второй main должен дождаться
          # конца первого. Запуск сразу за выходом проверяет, что после этого
          # процесс по-прежнему открывает программу и рисует.
          timeout 30s "$adb" -s emulator-5554 shell am start -W -n "$viewer" \
            || fail "the viewer did not start without arguments"
          timeout 30s "$adb" -s emulator-5554 shell am start --activity-clear-task \
            -n "$viewer" --es args --smoke || fail "the viewer did not start over itself"
          expect_lines 'waiting for the previous run of the program to end' 1
          expect_lines 'viewer: the picture is on screen' 2
          expect_lines 'its activity is closing' 2
          timeout 30s "$adb" -s emulator-5554 shell am start -W -n "$viewer" --es args --smoke \
            || fail "the viewer did not start again"
          expect_lines 'viewer: the picture is on screen' 3
          cat "$log"
          now="$(viewer_process)" || fail "the viewer process is gone"
          if [ "$process" != "$now" ]; then
            fail "the runs did not share process $process (now $now)"
          fi
      - name: Stop the owned emulator process group
        if: always()
        timeout-minutes: 1
        run: |
          pid_file="$RUNNER_TEMP/laiue-emulator.pid"
          if [ -f "$pid_file" ]; then
            emulator_pid="$(cat "$pid_file")"
            if [[ ! "$emulator_pid" =~ ^[0-9]+$ ]]; then exit 1; fi
            if kill -0 -- "-$emulator_pid" 2>/dev/null; then
              if timeout 10s "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill; then
                graceful_deadline=$((SECONDS + 20))
                while kill -0 -- "-$emulator_pid" 2>/dev/null; do
                  if [ "$SECONDS" -ge "$graceful_deadline" ]; then break; fi
                  sleep 1
                done
              fi
            fi
            if kill -0 -- "-$emulator_pid" 2>/dev/null; then
              if ! kill -TERM -- "-$emulator_pid" 2>/dev/null \
                && kill -0 -- "-$emulator_pid" 2>/dev/null; then exit 1; fi
              stop_deadline=$((SECONDS + 15))
              while kill -0 -- "-$emulator_pid" 2>/dev/null; do
                if [ "$SECONDS" -ge "$stop_deadline" ]; then
                  if ! kill -KILL -- "-$emulator_pid" 2>/dev/null \
                    && kill -0 -- "-$emulator_pid" 2>/dev/null; then exit 1; fi
                  break
                fi
                sleep 1
              done
            fi
          fi
      - name: Upload Android runtime captures and diagnostics
        if: always() && hashFiles('build/android-runtime-results/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laiue-walk-android
          path: build/android-runtime-results
          if-no-files-found: error
      - name: Verify runtime checks did not modify sources
        run: |
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" \
            -P tools/verify_source_tree.cmake

  static-analysis:
    name: Static analysis (clang-tidy)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "clang-$LLVM_VERSION" "clang-tidy-$LLVM_VERSION" \
            libvulkan-dev libx11-dev
      # Профиль Vulkan/X11 компилирует больше всего Linux-исходников. Код
      # Android и ветки ARM64 проверяет job Android ARM64, а код только для
      # Windows — тот же .clang-tidy локально в дереве clang-cl.
      - name: Configure with a compile database
        run: >
          cmake --preset linux-vulkan-offscreen -B build/tidy
          "-DCMAKE_C_COMPILER=clang-$LLVM_VERSION" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DLAIUE_BUILD_EXAMPLES=ON
      - name: Build generated sources
        run: cmake --build build/tidy --config Debug --parallel
      - name: Run clang-tidy
        run: run-clang-tidy-"$LLVM_VERSION" -p build/tidy -quiet -j "$(nproc)" "$GITHUB_WORKSPACE/src/.*[.]c$"

  macos-engine:
    name: macOS core (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            architecture: arm64
            preset: macos-clang-arm64
          - runner: macos-26-intel
            architecture: x86_64
            preset: macos-clang-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi
      - name: Configure headless core
        run: |
          cmake --preset "${{ matrix.preset }}" \
            -DLAIUE_BUILD_GRAPHICS=OFF -DLAIUE_BUILD_EXAMPLES=ON
      - name: Build and test Debug
        run: |
          cmake --build --preset "${{ matrix.preset }}-debug" --parallel
          ctest --preset "${{ matrix.preset }}-debug" --parallel --no-tests=error
      - name: Build and test Release
        run: |
          cmake --build --preset "${{ matrix.preset }}-release" --parallel
          ctest --preset "${{ matrix.preset }}-release" --parallel --no-tests=error
      - name: Stage core SDK
        run: >
          cmake --build --preset "${{ matrix.preset }}-release"
          --target laiue_engine_bundle
      - name: Compile iOS ARM64 static core
        if: matrix.architecture == 'arm64'
        run: |
          xcodebuild -version
          cmake --preset ios-arm64-core
          cmake --build --preset ios-arm64-core-debug --parallel
          cmake --build --preset ios-arm64-core-release --parallel
      - name: Verify complete iOS static-link closure without LTO
        if: matrix.architecture == 'arm64'
        run: |
          cmake --preset ios-arm64-core -B build/ios-arm64-core-closure \
            -DLAIUE_ENABLE_LTO=OFF
          cmake --build build/ios-arm64-core-closure --config Debug --parallel \
            --target laiue_static_core_link_smoke
      - name: Upload macOS core SDK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laiue-engine-macos-${{ matrix.architecture }}
          path: build/${{ matrix.preset }}/bundles/engine/Release
          if-no-files-found: error
      - name: Verify build did not modify sources
        run: |
          cmake -DSOURCE_ROOT="$GITHUB_WORKSPACE" \
            -P tools/verify_source_tree.cmake

  ci:
    name: All checks
    if: always()
    needs:
      - windows-engine
      - windows-arm64-engine
      - linux-engine
      - linux-fuzz-corpus
      - linux-vulkan-engine
      - linux-arm64-engine
      - musl-engine
      - static-analysis
      - android-arm64-engine
      - android-emulator-runtime
      - macos-engine
    runs-on: ubuntu-slim
    steps:
      - name: Require every job to pass
        if: >
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package engine SDKs
        run: |
          gh run download "$GITHUB_RUN_ID" --pattern 'laiue-engine-*' --dir dist
          cd dist
          for sdk in laiue-engine-*; do
            zip -qr "$sdk-$GITHUB_REF_NAME.zip" "$sdk"
          done
          sha256sum ./*.zip | tee SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Publish the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            /^## / { found = index($0, "## " version " ") == 1 || $0 == "## " version; next }
            found' CHANGELOG.md > notes.md
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if [[ ! -s notes.md ]]; then
            echo "Pre-release build of $GITHUB_SHA." > notes.md
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --verify-tag \
            --title "laiue $version" --notes-file notes.md "${flags[@]}"
