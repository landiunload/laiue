name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-msvc-arm64-fix:
    runs-on: windows-11-arm
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activate ARM64 compiler environment
        id: toolset
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            -property installationPath
          $vsRoot = @($vsRoot)[0].Trim()
          Import-Module (Join-Path $vsRoot `
            'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsRoot `
            -SkipAutomaticLocation -DevCmdArguments '-arch=arm64 -host_arch=arm64'
          $env:PATH = ($env:PATH -split ';' |
            Where-Object { $_ -notlike '*\Microsoft\CMake\*' }) -join ';'
          "image $env:ImageVersion, MSVC $env:VCToolsVersion"
          foreach ($name in 'INCLUDE', 'LIB', 'LIBPATH', 'PATH') {
            "$name=$([Environment]::GetEnvironmentVariable($name))" |
              Out-File $env:GITHUB_ENV -Append
          }
          $match = if ($env:VCToolsVersion -like '14.52.*') { 'true' } else { 'false' }
          "match=$match" | Out-File $env:GITHUB_OUTPUT -Append
      - name: Configure with link maps
        if: steps.toolset.outputs.match == 'true'
        run: >
          cmake --preset windows-msvc-arm64 -DLAIUE_BUILD_EXAMPLES=ON
          '-DCMAKE_EXE_LINKER_FLAGS=/machine:ARM64 /MAP'
          '-DCMAKE_SHARED_LINKER_FLAGS=/machine:ARM64 /MAP'
      - name: Build Release
        if: steps.toolset.outputs.match == 'true'
        run: cmake --build --preset windows-msvc-arm64-release --parallel
      - name: Test Release
        if: steps.toolset.outputs.match == 'true'
        run: >
          ctest --preset windows-msvc-arm64-release --parallel --no-tests=error
          --output-on-failure -E '^laiue[.]tools[.]check_versions$'
      - name: Repeat the determinism test
        if: steps.toolset.outputs.match == 'true'
        run: >
          ctest --test-dir build/windows-msvc-arm64 -C Release
          -R '^laiue[.]physics[.]determinism$' --repeat until-fail:300
          --output-on-failure --no-tests=error
      - name: Scan every engine DLL
        if: steps.toolset.outputs.match == 'true'
        shell: pwsh
        run: ./probe/scan_stores.ps1 -Bin build/windows-msvc-arm64/bin/Release -Include '*.dll' -Show 400
      - name: Scan every executable
        if: steps.toolset.outputs.match == 'true'
        shell: pwsh
        run: ./probe/scan_stores.ps1 -Bin build/windows-msvc-arm64/bin/Release -Include '*.exe' -Show 400
