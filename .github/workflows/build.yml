name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-physics-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activate ARM64 compiler environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            -property installationPath
          if (!$vsRoot) { throw 'Visual Studio ARM64 C tools were not found' }
          $vsRoot = @($vsRoot)[0].Trim()
          Import-Module (Join-Path $vsRoot `
            'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsRoot `
            -SkipAutomaticLocation -DevCmdArguments '-arch=arm64 -host_arch=arm64'
          $env:PATH = ($env:PATH -split ';' |
            Where-Object { $_ -notlike '*\Microsoft\CMake\*' }) -join ';'
          cmake --version
          cl 2>&1 | Select-Object -First 1
          foreach ($name in 'INCLUDE', 'LIB', 'LIBPATH', 'PATH') {
            "$name=$([Environment]::GetEnvironmentVariable($name))" |
              Out-File $env:GITHUB_ENV -Append
          }
      - name: Build the main sources with link maps
        shell: pwsh
        run: |
          cmake --preset windows-msvc-arm64 -DLAIUE_BUILD_EXAMPLES=ON `
            '-DCMAKE_EXE_LINKER_FLAGS=/machine:ARM64 /MAP' `
            '-DCMAKE_SHARED_LINKER_FLAGS=/machine:ARM64 /MAP'
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }
          foreach ($preset in 'windows-msvc-arm64-release', 'windows-msvc-arm64-debug') {
            cmake --build --preset $preset --target laiue_physics_determinism_test
            if ($LASTEXITCODE -ne 0) { throw "$preset build failed" }
          }
      - name: Map the main crash frames
        shell: pwsh
        run: |
          ./probe/probe.ps1 -Mode map -Frames @(
            'laiue_physics_determinism_test.exe+0x1d20', 'laiue_world.dll+0x332c',
            'laiue_physics_determinism_test.exe+0x1f18', 'laiue_physics_determinism_test.exe+0x248c',
            'laiue_physics_determinism_test.exe+0x3a14')
      - name: Stress the main Release build
        shell: pwsh
        run: |
          ./probe/probe.ps1 -Mode stress -Runs 1500 -Parallel 4 -Label release-p4
          ./probe/probe.ps1 -Mode stress -Runs 800 -Parallel 12 -Label release-p12
      - name: Build Release with register dumps
        shell: pwsh
        run: |
          Copy-Item probe/test_runtime_dump.c tests/test_runtime.c -Force
          cmake --preset windows-msvc-arm64 -B build/probe-dump -DLAIUE_BUILD_EXAMPLES=ON `
            '-DCMAKE_EXE_LINKER_FLAGS=/machine:ARM64 /MAP' `
            '-DCMAKE_SHARED_LINKER_FLAGS=/machine:ARM64 /MAP'
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }
          cmake --build build/probe-dump --config Release --target laiue_physics_determinism_test
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
      - name: Stress the dump build
        shell: pwsh
        run: >
          ./probe/probe.ps1 -Mode stress -BuildDir build/probe-dump -Runs 1500 -Parallel 6
          -Label dump-p6 -ShowReports 3
      - name: Stress the dump build under full page heap
        shell: pwsh
        run: |
          $ifeo = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\laiue_physics_determinism_test.exe'
          New-Item -Force $ifeo | Out-Null
          New-ItemProperty $ifeo -Name GlobalFlag -Value 0x02000000 -PropertyType DWord -Force | Out-Null
          New-ItemProperty $ifeo -Name PageHeapFlags -Value 0x3 -PropertyType DWord -Force | Out-Null
          ./probe/probe.ps1 -Mode stress -BuildDir build/probe-dump -Runs 300 -Parallel 4 `
            -Label dump-pageheap -ShowReports 3
          Remove-Item $ifeo -Recurse -Force
      - name: Stress the main Debug build
        shell: pwsh
        run: >
          ./probe/probe.ps1 -Mode stress -Config Debug -Runs 300 -Parallel 4
          -Label debug-p4
